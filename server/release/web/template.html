<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Wolfpack Administration</title>

  <!-- Bootstrap 5 CSS -->
  <link rel="stylesheet" href="css/bootstrap.min.css" />
  <link rel="stylesheet" href="css/custom.css" />

  <style>
    body {
      background-color: #f8fafc;
      font-size: 0.9rem;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Topbar Verde Oficial Wolfpack com Logo */
    .wp-header {
      background-color: #004026;
      border-bottom: 2px solid #002b1a;
      height: 60px;
    }

    /* Layout principal */
    .wp-layout-wrapper {
      display: flex;
      flex: 1;
      min-height: calc(100vh - 60px);
    }

    /* Sidebar Estreita e Moderna */
    .wp-sidebar-slim {
      width: 195px;
      min-width: 195px;
      background-color: #ffffff;
      border-right: 1px solid #e2e8f0;
      display: flex;
      flex-direction: column;
    }

    .wp-sidebar-slim .nav-link {
      color: #475569;
      font-weight: 500;
      font-size: 0.85rem;
      padding: 0.55rem 0.85rem;
      border-radius: 6px;
      margin: 0.15rem 0.5rem;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .wp-sidebar-slim .nav-link:hover {
      background-color: #eaf2e8;
      color: #004026;
    }

    .wp-sidebar-slim .nav-link.active {
      background-color: #004026;
      color: #ffffff !important;
      font-weight: 600;
    }

    /* Avatar Redondo do Perfil */
    .wp-avatar-circle {
      width: 34px;
      height: 34px;
      background-color: #c6dbbf;
      color: #004026;
      font-weight: 700;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.4);
      text-transform: uppercase;
      user-select: none;
    }

    /* Área de Conteúdo 100% Fluida */
    .wp-content-area {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      background-color: #f8fafc;
    }
  </style>
</head>
<body>

  <!-- Top Header com Logo Oficial e Submenu de Perfil à Direita -->
  <header class="wp-header shadow-sm">
    <div class="container-fluid px-3 px-md-4 d-flex align-items-center justify-content-between h-100">
      
      <!-- Logo Wolfpack -->
      <div class="d-flex align-items-center">
        <a href="main.py" class="d-flex align-items-center text-decoration-none">
          <img src="images/top_logo.jpg" alt="Wolfpack Logo" class="img-fluid" style="max-height: 48px;" />
        </a>
      </div>

      <!-- Menu Profile / Dropdown de Usuário -->
      <div>
        %USERNAME%
      </div>

    </div>
  </header>

  <!-- Estrutura Principal -->
  <div class="wp-layout-wrapper">
    
    <!-- Sidebar Estreita à Esquerda -->
    %NAVBAR%

    <!-- Conteúdo Fluido -->
    <main class="wp-content-area p-3 p-md-4">
      <div class="card shadow-sm p-3 p-md-4 bg-white border-0 h-100">
        %CONTENT%
      </div>
    </main>

  </div>

  <!-- Rodapé Fino -->
  <footer class="py-2 px-4 bg-white border-top text-secondary small text-end">
    Wolfpack-Qt5 &bull; Remote Administration Console
  </footer>

  <!-- Bootstrap 5 JS (Necessário para abrir o dropdown de perfil) -->
  <script src="js/bootstrap.bundle.min.js"></script>
</body>
</html>
