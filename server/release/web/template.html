<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Wolfpack Administration</title>

	<!-- Bootstrap 5 CSS -->
	<link rel="stylesheet" href="css/bootstrap.min.css" />
	<link rel="stylesheet" href="css/custom.css" />

	<style>
		body {
			background-color: #f8fafc;
			font-size: 0.95rem;
		}

		.wp-header {
			background-color: #004026;
			border-bottom: 2px solid #002b1a;
		}

		.wp-userbar {
			background-color: #e9ecef;
			border-bottom: 1px solid #dee2e6;
			font-size: 0.85rem;
		}

		.wp-title {
			color: #004026;
			font-weight: 700;
			letter-spacing: 0.5px;
		}

		.wp-sidebar-card {
			border-color: #bcd0b5;
		}

		.wp-sidebar-header {
			background-color: #c6dbbf;
			color: #1b3819;
			font-weight: 600;
			font-size: 0.9rem;
		}

		.list-group-item-action:hover {
			background-color: #eaf2e8;
			color: #004026;
		}
	</style>
</head>

<body class="d-flex flex-column min-vh-100">

	<!-- Top Header com Banner / Logo -->
	<header class="wp-header shadow-sm">
		<div class="container-fluid px-3 px-md-4 d-flex align-items-center">
			<img src="images/top_logo.jpg" alt="Wolfpack Logo" class="img-fluid py-1" style="max-height: 80px;" />
		</div>
	</header>

	<!-- Barra de Usuário Logado -->
	<div class="wp-userbar py-1 px-3 px-md-4 text-secondary">
		<div class="container-xl">
			%USERNAME%
		</div>
	</div>

	<!-- Conteúdo Principal -->
	<main class="container-xl my-4 flex-grow-1">

		<!-- Título do Sistema -->
		<div class="text-center mb-4">
			<h4 class="wp-title mb-0">Wolfpack Remote Administration</h4>
		</div>

		<!-- Layout Grid: Sidebar + Conteúdo -->
		<div class="row g-4 justify-content-center">

			<!-- Menu Lateral (controlado via %NAVBAR%) -->
			%NAVBAR%

			<!-- Conteúdo da Página -->
			<section class="%CONTENT_COL%">
				<div class="card shadow-sm p-3 p-md-4 bg-white border-0">
					%CONTENT%
				</div>
			</section>

		</div>
	</main>

	<!-- Rodapé -->
	<footer class="mt-auto py-3 bg-white border-top text-center text-muted small">
		<div class="container-xl">
			Wolfpack-Qt5 &bull; Remote Administration Console
		</div>
	</footer>

	<!-- Bootstrap 5 JS -->
	<script src="js/bootstrap.bundle.min.js"></script>
</body>

</html>
